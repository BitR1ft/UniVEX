# ==============================================================================
# UniVex — Docker Compose Configuration
# Professional Open-Source Security Platform with Network Segmentation & Service Isolation
#
# Podman compatibility (Day 17):
#   • Tested with podman-compose >= 1.0 (rootless mode)
#   • Rootless Podman: set DOCKER_HOST=unix://$XDG_RUNTIME_DIR/podman/podman.sock
#   • SELinux enforcing: volume bind mounts use :z (shared) or :Z (private) labels
#   • userns_mode: keep-id — preserves host UID in rootless containers
#   • Named volumes use the local driver (no Docker-specific options)
#   • Run the TUI installer: bash scripts/install-podman.sh
# ==============================================================================

services:
  # ============================================================================
  # DATABASE TIER - Isolated Data Layer
  # ============================================================================
  
  # PostgreSQL Database - Relational Data
  postgres:
    image: postgres:16-alpine
    container_name: univex-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-univex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-univex}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
      # Performance tuning
      POSTGRES_MAX_CONNECTIONS: "200"
      POSTGRES_SHARED_BUFFERS: "256MB"
      POSTGRES_EFFECTIVE_CACHE_SIZE: "1GB"
      POSTGRES_WORK_MEM: "16MB"
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - postgres-backups:/backups
      - ./backend/init-scripts:/docker-entrypoint-initdb.d:ro
    networks:
      - db-network
      - backend-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-univex} -d ${POSTGRES_DB:-univex}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

  # Neo4j Graph Database - Attack Graph & Relationships
  neo4j:
    image: neo4j:5.15-community
    container_name: univex-neo4j
    restart: unless-stopped
    environment:
      # Authentication
      NEO4J_AUTH: ${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:?NEO4J_PASSWORD must be set in .env}
      
      # APOC Plugin Configuration
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_apoc_export_file_enabled: "true"
      NEO4J_apoc_import_file_enabled: "true"
      NEO4J_apoc_import_file_use__neo4j__config: "true"
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*,gds.*"
      NEO4J_dbms_security_procedures_allowlist: "apoc.*,gds.*"
      
      # Memory Configuration (optimized for graph operations)
      NEO4J_dbms_memory_heap_initial__size: "512m"
      NEO4J_dbms_memory_heap_max__size: "2g"
      NEO4J_dbms_memory_pagecache_size: "1g"
      NEO4J_dbms_memory_transaction_total_max: "512m"
      
      # Performance Tuning
      NEO4J_dbms_transaction_timeout: "60s"
      NEO4J_dbms_lock_acquisition_timeout: "60s"
      NEO4J_dbms_query__cache__size: "512"
      
      # Connector Configuration
      NEO4J_dbms_connector_bolt_listen__address: ":7687"
      NEO4J_dbms_connector_http_listen__address: ":7474"
      NEO4J_dbms_connector_bolt_advertised__address: ":7687"
      
      # Security
      NEO4J_dbms_security_allow__csv__import__from__file__urls: "true"
    ports:
      - "127.0.0.1:${NEO4J_HTTP_PORT:-7474}:7474"  # HTTP
      - "127.0.0.1:${NEO4J_BOLT_PORT:-7687}:7687"  # Bolt
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
      - neo4j-import:/var/lib/neo4j/import
      - neo4j-plugins:/plugins
      - neo4j-backups:/backups
    networks:
      - db-network
      - backend-network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 3G
        reservations:
          cpus: '0.5'
          memory: 1G

  # Redis Cache & Job Queue - Day 11
  redis:
    image: redis:7.2-alpine
    container_name: univex-redis
    restart: unless-stopped
    command: redis-server /usr/local/etc/redis/redis.conf
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - ./docker/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - redis-data:/data
    networks:
      - db-network
      - backend-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 768M
        reservations:
          cpus: '0.1'
          memory: 128M

  # ============================================================================
  # APPLICATION TIER - Core Services
  # ============================================================================
  
  # FastAPI Backend - Main API Server
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        PYTHON_VERSION: "3.11"
    container_name: univex-backend
    restart: unless-stopped
    environment:
      # Application
      ENVIRONMENT: ${ENVIRONMENT:-development}
      PROJECT_NAME: "UniVex"
      VERSION: "1.0.0"
      DEBUG: ${DEBUG:-false}
      
      # Database URLs
      DATABASE_URL: postgresql://${POSTGRES_USER:-univex}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-univex}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      
      # Security
      SECRET_KEY: ${SECRET_KEY:-change_this_to_a_very_long_random_secret_key}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      
      # Cookie Security (Day 18)
      COOKIE_SIGNING_SALT: ${COOKIE_SIGNING_SALT:-}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
      SESSION_COOKIE_HTTPONLY: ${SESSION_COOKIE_HTTPONLY:-true}
      SESSION_COOKIE_SAMESITE: ${SESSION_COOKIE_SAMESITE:-Lax}
      SESSION_COOKIE_MAX_AGE: ${SESSION_COOKIE_MAX_AGE:-1800}
      
      # Custom CA & SSL (Day 18) — enterprise PKI support
      EXTERNAL_SSL_CA_PATH: ${EXTERNAL_SSL_CA_PATH:-}
      SSL_VERIFY: ${SSL_VERIFY:-true}
      SSL_MIN_TLS_VERSION: ${SSL_MIN_TLS_VERSION:-TLSv1_2}
      SSL_CLIENT_CERT_PATH: ${SSL_CLIENT_CERT_PATH:-}
      SSL_CLIENT_KEY_PATH: ${SSL_CLIENT_KEY_PATH:-}
      
      # CORS
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:-["http://localhost:3000","http://localhost:8000"]}
      
      # API Configuration
      API_HOST: "0.0.0.0"
      API_PORT: "8000"
      
      # Docker SDK (for container orchestration)
      # Podman rootless: override with DOCKER_HOST=unix://$XDG_RUNTIME_DIR/podman/podman.sock
      DOCKER_HOST: ${DOCKER_HOST:-unix:///var/run/docker.sock}
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./backend:/app:ro
      - ./logs:/var/log/univex
      - /var/run/docker.sock:/var/run/docker.sock:ro  # For Docker SDK (Podman: override via DOCKER_HOST)
      - backend-cache:/cache
      # Custom CA certificates (Day 18) — mount enterprise CA bundle for outbound TLS
      # Create ./certs/ca/ and place .pem/.crt files there; set EXTERNAL_SSL_CA_PATH=/etc/ssl/custom-ca
      - ./certs/ca:/etc/ssl/custom-ca:ro
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    networks:
      - backend-network
      - frontend-network
      - tools-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.25'
          memory: 512M
    profiles: ["dev", "prod"]

  # Next.js Frontend - User Interface
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NODE_VERSION: "20"
        NEXT_TELEMETRY_DISABLED: "1"
    container_name: univex-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8000}
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - frontend-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M
    profiles: ["dev", "prod"]

  # ============================================================================
  # SECURITY TOOLS TIER - Isolated Security Tools
  # ============================================================================
  
  # Kali Linux Tools Container - Base Security Tools with MCP Servers
  kali-tools:
    build:
      context: ./docker/kali
      dockerfile: Dockerfile
    container_name: univex-kali-tools
    restart: unless-stopped
    privileged: false
    cap_add:
      - NET_RAW
      - NET_ADMIN
    environment:
      TOOLS_VERSION: "2024.1"
      PYTHONPATH: "/app:/app/backend"
    ports:
      # MCP Server ports (Month 11)
      - "8000:8000"  # Naabu MCP Server
      - "8001:8001"  # Curl MCP Server
      - "8002:8002"  # Nuclei MCP Server
      - "8003:8003"  # Metasploit MCP Server
      - "8004:8004"  # ffuf Web Fuzzing MCP Server (Week 2 Betterment Plan)
      - "8005:8005"  # SQLMap MCP Server (Week 3 Betterment Plan)
      - "8006:8006"  # Hash Cracker MCP Server (Week 4 Betterment Plan)
      - "8007:8007"  # Nikto MCP Server (Week 6 Betterment Plan)
    volumes:
      - kali-tools-data:/root
      - scan-results:/results
      - tool-configs:/configs:ro
      # Mount MCP servers from backend (Month 11)
      - ./backend/app/mcp:/app/mcp:ro
    networks:
      - tools-network
      - backend-network
    command: tail -f /dev/null  # Keep container running
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 4G
        reservations:
          cpus: '1'
          memory: 1G
    profiles: ["tools", "dev", "prod"]

  # Reconnaissance Container - Dedicated Recon Tools
  recon-container:
    build:
      context: ./docker/recon
      dockerfile: Dockerfile
    container_name: univex-recon
    restart: unless-stopped
    privileged: false
    cap_add:
      - NET_RAW
    environment:
      PYTHONUNBUFFERED: "1"
      RECON_OUTPUT_DIR: "/results/recon"
    volumes:
      - ./backend/app/tools:/app/tools:ro
      - scan-results:/results
      - tool-configs:/configs:ro
    networks:
      - tools-network
    command: tail -f /dev/null  # Keep container running
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    profiles: ["tools", "dev", "prod"]

# ==============================================================================
# OBSERVABILITY TIER - Monitoring & Metrics
# ==============================================================================

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: univex-prometheus
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./docker/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=15d'
    networks:
      - backend-network
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M

  grafana:
    image: grafana/grafana:10.4.0
    container_name: univex-grafana
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:?GRAFANA_PASSWORD must be set in .env}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./docker/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - backend-network
    depends_on:
      - prometheus
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M

  # ChromaDB Vector Store - RAG Knowledge Base (Day 8)
  chromadb:
    image: chromadb/chroma:1.0.21
    container_name: univex-chromadb
    restart: unless-stopped
    ports:
      - "127.0.0.1:${CHROMA_PORT:-8005}:8000"
    volumes:
      - chroma-data:/chroma/chroma
    networks:
      - backend-network
    environment:
      CHROMA_SERVER_HOST: "0.0.0.0"
      CHROMA_SERVER_HTTP_PORT: "8000"
      ANONYMIZED_TELEMETRY: "false"
      IS_PERSISTENT: "true"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v2/heartbeat"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M

  # Graphiti Knowledge Graph Service - Semantic Memory (Gap Coverage Day 1)
  # Wraps Neo4j with semantic relationship extraction for agent memory.
  searxng:
    image: searxng/searxng:latest
    container_name: univex-searxng
    restart: unless-stopped
    ports:
      - "127.0.0.1:${SEARXNG_PORT:-8080}:8080"
    volumes:
      - ./docker/searxng:/etc/searxng:rw
    environment:
      SEARXNG_SECRET_KEY: ${SEARXNG_SECRET_KEY:-changeme}
      SEARXNG_BASE_URL: ${SEARXNG_BASE_URL:-http://localhost:8080/}
    networks:
      - backend-network
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M

  graphiti:
    image: zepai/graphiti:latest
    container_name: univex-graphiti
    restart: unless-stopped
    ports:
      - "127.0.0.1:${GRAPHITI_PORT:-8010}:8000"
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?NEO4J_PASSWORD must be set in .env}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      PORT: "8000"
      HOST: "0.0.0.0"
    networks:
      - backend-network
      - db-network
    depends_on:
      neo4j:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M

# ==============================================================================
# ARTIFACT STORAGE TIER - MinIO S3-Compatible Object Store (Day 14)
# ==============================================================================

  # MinIO — S3-Compatible Artifact Store
  # Stores: report PDFs, evidence screenshots, tool output JSON, compliance exports
  minio:
    image: minio/minio:RELEASE.2025-01-20T14-49-07Z
    container_name: univex-minio
    restart: unless-stopped
    command: server /data --console-address ":9101"
    environment:
      MINIO_ROOT_USER: "${MINIO_ACCESS_KEY:-minioadmin}"
      MINIO_ROOT_PASSWORD: "${MINIO_SECRET_KEY:?MINIO_SECRET_KEY must be set in .env}"
      MINIO_SITE_NAME: "univex-artifacts"
      MINIO_SITE_REGION: "${MINIO_REGION:-us-east-1}"
      # Prometheus metrics
      MINIO_PROMETHEUS_AUTH_TYPE: "public"
      # Audit logging
      MINIO_AUDIT_WEBHOOK_ENABLE: "off"
    ports:
      - "127.0.0.1:${MINIO_PORT:-9100}:9000"          # S3 API
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9101}:9101"   # Web Console
    volumes:
      - minio-data:/data
    networks:
      - backend-network
      - db-network
    healthcheck:
      test: ["CMD-SHELL", "mc ready local 2>/dev/null || wget --no-verbose --tries=1 --spider http://localhost:9000/minio/health/live || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.1'
          memory: 128M

  # Browser Sandbox — Isolated Headless Playwright Browser (Day 15)
  # Runs Playwright/Chromium in an isolated sandbox container.
  # No access to db-network — cannot reach databases or internal services.
  browser:
    image: mcr.microsoft.com/playwright/python:v1.44.0-jammy
    container_name: univex-browser
    restart: unless-stopped
    command: python -m uvicorn app.mcp.servers.browser_server:create_app --host 0.0.0.0 --port 8015 --factory
    environment:
      MINIO_ENDPOINT: "minio:9000"
      MINIO_ACCESS_KEY: "${MINIO_ACCESS_KEY:-minioadmin}"
      MINIO_SECRET_KEY: "${MINIO_SECRET_KEY:-minioadmin123}"
      MINIO_BUCKET_SCREENSHOTS: "${MINIO_BUCKET_SCREENSHOTS:-univex-screenshots}"
      BROWSER_TIMEOUT_MS: "${BROWSER_TIMEOUT_MS:-30000}"
      # Deny access to cloud metadata endpoints from the browser sandbox
      NO_PROXY: "169.254.169.254,metadata.google.internal"
    ports:
      - "127.0.0.1:8015:8015"
    networks:
      - backend-network
      - tools-network
    # Chromium requires --no-sandbox when run as root; we drop privileges instead
    user: "pwuser"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - SYS_ADMIN   # required by Chromium's sandboxing
    tmpfs:
      - /tmp:size=512m,mode=1777
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.25'
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8015/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # OOB Listener — Out-of-Band Callback Server (Day 15)
  # Receives HTTP/DNS/SMTP callbacks from vulnerable target applications.
  # Must have a public/routable IP for blind vulnerability detection.
  oob-listener:
    image: python:3.12-slim
    container_name: univex-oob-listener
    restart: unless-stopped
    command: python3 /app/run_oob_listener.py
    working_dir: /app
    volumes:
      - ./backend:/app
    environment:
      PYTHONPATH: /app
      OOB_EXTERNAL_IP: "${OOB_EXTERNAL_IP:-127.0.0.1}"
      OOB_HTTP_PORT: "${OOB_HTTP_PORT:-8090}"
      OOB_DNS_PORT: "${OOB_DNS_PORT:-5353}"
      OOB_SMTP_PORT: "${OOB_SMTP_PORT:-2525}"
      OOB_TOKEN_TTL: "${OOB_TOKEN_TTL:-3600}"
    ports:
      - "${OOB_HTTP_PORT:-8090}:8080"       # HTTP callbacks (host:${OOB_HTTP_PORT:-8090} → container:8080)
      - "${OOB_SMTP_PORT:-2525}:2525"       # SMTP callbacks
      - "${OOB_DNS_PORT:-5353}:5353/udp"    # DNS callbacks
    networks:
      - backend-network
      - tools-network
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.05'
          memory: 64M

# ==============================================================================
# Proxy Service — HTTP/HTTPS Intercepting Proxy (Day 6)
# Wraps the UniVex proxy engine as an MCP server for agent control.
# ==============================================================================
  proxy:
    build:
      context: ./docker/kali
      dockerfile: Dockerfile
    container_name: univex-proxy
    restart: unless-stopped
    command: >
      python3 -m uvicorn app.mcp.servers.proxy_server:create_app
      --host 0.0.0.0 --port 8008 --factory
    environment:
      PROXY_PORT: "${PROXY_PORT:-8888}"
      PROXY_UPSTREAM: "${PROXY_UPSTREAM:-}"
      PROXY_SSL_VERIFY: "${PROXY_SSL_VERIFY:-false}"
      PROXY_MCP_PORT: "8008"
      PROXY_MCP_API_KEY: "${PROXY_MCP_API_KEY:-}"
      REDIS_URL: "${REDIS_URL:-redis://redis:6379/0}"
    ports:
      - "127.0.0.1:${PROXY_PORT:-8888}:${PROXY_PORT:-8888}"   # Intercepting proxy port — configure browser to use this
      - "127.0.0.1:8008:8008"   # Proxy MCP server port (agent control)
    networks:
      - backend-network
      - tools-network
    depends_on:
      - redis
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE   # Allow binding to privileged ports if PROXY_PORT < 1024
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8008/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

networks:
  # Database Network - Only accessible by backend services
  db-network:
    driver: bridge
    name: univex-db-network
    internal: true  # Not exposed to host
    ipam:
      driver: default
      config:
        - subnet: 172.20.1.0/24
  
  # Backend Network - API and backend services
  backend-network:
    driver: bridge
    name: univex-backend-network
    ipam:
      driver: default
      config:
        - subnet: 172.20.2.0/24
  
  # Frontend Network - Frontend to backend communication
  frontend-network:
    driver: bridge
    name: univex-frontend-network
    ipam:
      driver: default
      config:
        - subnet: 172.20.3.0/24
  
  # Tools Network - Isolated security tools
  tools-network:
    driver: bridge
    name: univex-tools-network
    ipam:
      driver: default
      config:
        - subnet: 172.20.4.0/24

