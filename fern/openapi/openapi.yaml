openapi: 3.1.0
info:
  title: UniVex API
  description: >
    Professional AI-powered pentesting and vulnerability management platform.
    UniVex (Universal + Vulnerability Execution) provides a comprehensive suite
    of security automation tools including AI agent orchestration, reconnaissance,
    vulnerability scanning, exploit chaining, compliance assessment, and reporting.
  version: 2.1.0
  contact:
    name: BitR1FT
  license:
    name: MIT

servers:
  - url: http://localhost:8000
    description: Local development server

security:
  - BearerAuth: []

tags:
  - name: Authentication
    description: User registration, login, token management
  - name: Projects
    description: Pentest project lifecycle management
  - name: Graph
    description: Neo4j graph ingestion, querying, and attack surface analysis
  - name: AI Agent
    description: LangGraph multi-agent orchestration and real-time communication
  - name: Reconnaissance
    description: OSINT, subdomain enumeration, and target reconnaissance
  - name: Port Scanning
    description: Naabu-backed port scanning tasks
  - name: HTTP Probing
    description: HTTP service probing and fingerprinting
  - name: Scans
    description: Unified scan management (ports, Nuclei)
  - name: URL Discovery
    description: URL and directory discovery tasks
  - name: CVE Enrichment
    description: CVE lookup and finding enrichment
  - name: CWE/CAPEC Enrichment
    description: CWE and CAPEC taxonomy enrichment and mapping
  - name: AutoChain
    description: Automated exploitation chain orchestration
  - name: Reports
    description: Report generation, download, and artifact management
  - name: Campaigns
    description: Multi-target campaign management
  - name: Findings
    description: Vulnerability finding CRUD, triage, evidence, and CVSS
  - name: Compliance
    description: Compliance framework assessment (OWASP, PCI-DSS, NIST, CIS)
  - name: Integrations
    description: Webhooks, SIEM, Splunk, ELK, and syslog integrations
  - name: Plugins
    description: Plugin management
  - name: SSE
    description: Server-Sent Events streams for real-time scan and log updates
  - name: Metrics
    description: Prometheus metrics endpoint
  - name: Health
    description: Health and readiness probes

paths:

  # ──────────────────────────────────────────────
  # Authentication
  # ──────────────────────────────────────────────

  /api/auth/register:
    post:
      tags: [Authentication]
      operationId: registerUser
      summary: Register a new user
      description: Creates a new user account. Returns the created user profile on success.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreate'
            example:
              email: analyst@example.com
              username: analyst01
              password: Sup3rS3cur3!
              full_name: Alice Analyst
              role: analyst
      responses:
        '201':
          description: User created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/auth/login:
    post:
      tags: [Authentication]
      operationId: loginUser
      summary: Authenticate and obtain JWT tokens
      description: Authenticates with username and password. Returns access and refresh JWT tokens.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserLogin'
            example:
              username: analyst01
              password: Sup3rS3cur3!
      responses:
        '200':
          description: Authentication successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Token'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/auth/me:
    get:
      tags: [Authentication]
      operationId: getCurrentUser
      summary: Get current authenticated user
      description: Returns the profile of the currently authenticated user based on the Bearer token.
      responses:
        '200':
          description: Current user profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/auth/refresh:
    post:
      tags: [Authentication]
      operationId: refreshToken
      summary: Refresh JWT access token
      description: Issues a new access token using the current valid Bearer refresh token.
      responses:
        '200':
          description: New token pair issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Token'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/auth/logout:
    post:
      tags: [Authentication]
      operationId: logout
      summary: Logout current session
      description: Invalidates the current session token.
      responses:
        '200':
          description: Logged out successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/auth/logout-all:
    post:
      tags: [Authentication]
      operationId: logoutAll
      summary: Logout all sessions
      description: Invalidates all active sessions for the current user.
      responses:
        '200':
          description: All sessions terminated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ──────────────────────────────────────────────
  # Projects
  # ──────────────────────────────────────────────

  /api/projects:
    get:
      tags: [Projects]
      operationId: listProjects
      summary: List projects
      description: Returns a paginated list of pentest projects owned by the authenticated user.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - name: status
          in: query
          schema:
            type: string
            enum: [draft, queued, running, paused, completed, failed]
          description: Filter by project status
      responses:
        '200':
          description: Paginated project list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectListResponse'
    post:
      tags: [Projects]
      operationId: createProject
      summary: Create a new project
      description: Creates a new pentest project with the specified target and scan configuration.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectCreate'
      responses:
        '201':
          description: Project created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponse'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/projects/{project_id}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [Projects]
      operationId: getProject
      summary: Get project by ID
      responses:
        '200':
          description: Project details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponse'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Projects]
      operationId: updateProject
      summary: Update a project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectUpdate'
      responses:
        '200':
          description: Updated project
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectResponse'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Projects]
      operationId: deleteProject
      summary: Delete a project
      responses:
        '204':
          description: Project deleted
        '404':
          $ref: '#/components/responses/NotFound'

  # ──────────────────────────────────────────────
  # Graph
  # ──────────────────────────────────────────────

  /api/ingest:
    post:
      tags: [Graph]
      operationId: ingestGraph
      summary: Ingest scan data into graph DB
      description: Ingests structured scan phase data into the Neo4j attack surface graph.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GraphIngestRequest'
      responses:
        '200':
          description: Ingestion result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GraphIngestResponse'

  /api/query:
    post:
      tags: [Graph]
      operationId: queryGraph
      summary: Execute a graph query
      description: Executes a Cypher query against the Neo4j graph database.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GraphQueryRequest'
      responses:
        '200':
          description: Query results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GraphQueryResponse'

  /api/attack-surface/{project_id}:
    get:
      tags: [Graph]
      operationId: getAttackSurface
      summary: Get attack surface graph
      description: Returns the full attack surface graph for a project.
      security: []
      parameters:
        - $ref: '#/components/parameters/ProjectIdPath'
      responses:
        '200':
          description: Attack surface graph
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttackSurfaceResponse'

  /api/attack-surface/{project_id}/services:
    get:
      tags: [Graph]
      operationId: getAttackSurfaceServices
      summary: Get attack surface services
      security: []
      parameters:
        - $ref: '#/components/parameters/ProjectIdPath'
      responses:
        '200':
          description: Service nodes
          content:
            application/json:
              schema:
                type: object

  /api/attack-surface/{project_id}/overview:
    get:
      tags: [Graph]
      operationId: getAttackSurfaceOverview
      summary: Get attack surface overview
      security: []
      parameters:
        - $ref: '#/components/parameters/ProjectIdPath'
      responses:
        '200':
          description: Attack surface overview
          content:
            application/json:
              schema:
                type: object

  /api/vulnerabilities/{project_id}:
    get:
      tags: [Graph]
      operationId: getVulnerabilities
      summary: Get vulnerability nodes for a project
      security: []
      parameters:
        - $ref: '#/components/parameters/ProjectIdPath'
      responses:
        '200':
          description: Vulnerability nodes
          content:
            application/json:
              schema:
                type: object

  /api/vulnerabilities/{project_id}/exploitable:
    get:
      tags: [Graph]
      operationId: getExploitableVulnerabilities
      summary: Get exploitable vulnerabilities
      security: []
      parameters:
        - $ref: '#/components/parameters/ProjectIdPath'
      responses:
        '200':
          description: Exploitable vulnerability nodes
          content:
            application/json:
              schema:
                type: object

  /api/vulnerabilities/{project_id}/cve-chain/{cve_id}:
    get:
      tags: [Graph]
      operationId: getCveAttackChain
      summary: Get CVE attack chain
      security: []
      parameters:
        - $ref: '#/components/parameters/ProjectIdPath'
        - name: cve_id
          in: path
          required: true
          schema:
            type: string
          description: CVE identifier (e.g. CVE-2023-1234)
      responses:
        '200':
          description: CVE attack chain graph
          content:
            application/json:
              schema:
                type: object

  /api/technologies/{project_id}:
    get:
      tags: [Graph]
      operationId: getTechnologies
      summary: Get technology nodes for a project
      security: []
      parameters:
        - $ref: '#/components/parameters/ProjectIdPath'
      responses:
        '200':
          description: Technology nodes
          content:
            application/json:
              schema:
                type: object

  /api/project/{project_id}:
    delete:
      tags: [Graph]
      operationId: deleteProjectGraph
      summary: Delete project graph data
      security: []
      parameters:
        - $ref: '#/components/parameters/ProjectIdPath'
      responses:
        '204':
          description: Graph data deleted

  /api/health:
    get:
      tags: [Graph]
      operationId: graphHealth
      summary: Graph database health check
      security: []
      responses:
        '200':
          description: Graph DB health status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /api/stats/{project_id}:
    get:
      tags: [Graph]
      operationId: getGraphStats
      summary: Get graph statistics for a project
      security: []
      parameters:
        - $ref: '#/components/parameters/ProjectIdPath'
      responses:
        '200':
          description: Graph statistics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GraphStatsResponse'

  /api/stats/{project_id}/relationships:
    get:
      tags: [Graph]
      operationId: getRelationshipStats
      summary: Get relationship statistics
      security: []
      parameters:
        - $ref: '#/components/parameters/ProjectIdPath'
      responses:
        '200':
          description: Relationship statistics
          content:
            application/json:
              schema:
                type: object

  /api/stats/{project_id}/health:
    get:
      tags: [Graph]
      operationId: getNodeHealthStats
      summary: Get node health statistics
      security: []
      parameters:
        - $ref: '#/components/parameters/ProjectIdPath'
      responses:
        '200':
          description: Node health statistics
          content:
            application/json:
              schema:
                type: object

  /api/paths/{project_id}/attack:
    get:
      tags: [Graph]
      operationId: getAttackPaths
      summary: Get attack paths for a project
      security: []
      parameters:
        - $ref: '#/components/parameters/ProjectIdPath'
      responses:
        '200':
          description: Attack paths
          content:
            application/json:
              schema:
                type: object

  /api/paths/{project_id}/critical:
    get:
      tags: [Graph]
      operationId: getCriticalPaths
      summary: Get critical attack paths
      security: []
      parameters:
        - $ref: '#/components/parameters/ProjectIdPath'
      responses:
        '200':
          description: Critical paths
          content:
            application/json:
              schema:
                type: object

  # ──────────────────────────────────────────────
  # AI Agent
  # ──────────────────────────────────────────────

  /api/status:
    get:
      tags: [AI Agent]
      operationId: getAgentStatus
      summary: Get AI agent status
      description: Returns the current execution state of the LangGraph multi-agent system.
      responses:
        '200':
          description: Agent status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentStatus'

  /api/chat:
    post:
      tags: [AI Agent]
      operationId: chat
      summary: Send a message to the AI agent
      description: >
        Sends a natural language message to the AI pentesting agent. The agent
        classifies intent and routes to the appropriate specialist agent node.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatRequest'
      responses:
        '200':
          description: Agent response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatResponse'

  /api/stop:
    post:
      tags: [AI Agent]
      operationId: stopAgent
      summary: Stop agent execution
      description: Signals the running agent graph to halt execution gracefully.
      responses:
        '200':
          description: Agent stopped
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'

  /api/resume:
    post:
      tags: [AI Agent]
      operationId: resumeAgent
      summary: Resume agent execution
      description: Resumes a paused or interrupted agent execution from its last checkpoint.
      responses:
        '200':
          description: Agent resumed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'

  /api/guidance:
    post:
      tags: [AI Agent]
      operationId: sendGuidance
      summary: Send human guidance to the agent
      description: Injects human-in-the-loop guidance into the running agent graph.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GuidanceRequest'
      responses:
        '200':
          description: Guidance accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'

  /api/approve:
    post:
      tags: [AI Agent]
      operationId: approveTool
      summary: Approve pending tool execution
      description: Approves a tool call that is waiting for human approval before execution.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApprovalRequest'
      responses:
        '200':
          description: Tool execution approved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'

  /api/ws/{client_id}:
    get:
      tags: [AI Agent]
      operationId: agentWebSocket
      summary: WebSocket for real-time agent communication
      description: >
        Establishes a WebSocket connection for bidirectional real-time communication
        with the AI agent. Clients receive streaming agent output, tool calls, and
        status updates.
      parameters:
        - name: client_id
          in: path
          required: true
          schema:
            type: string
          description: Unique client identifier for WebSocket session
      responses:
        '101':
          description: WebSocket connection established

  # ──────────────────────────────────────────────
  # Reconnaissance
  # ──────────────────────────────────────────────

  /api/recon:
    post:
      tags: [Reconnaissance]
      operationId: startRecon
      summary: Start a reconnaissance task
      description: Launches an asynchronous reconnaissance task for the specified target.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReconRequest'
      responses:
        '202':
          description: Recon task accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskResponse'

  /api/recon/{task_id}:
    get:
      tags: [Reconnaissance]
      operationId: getReconStatus
      summary: Get recon task status
      parameters:
        - $ref: '#/components/parameters/TaskId'
      responses:
        '200':
          description: Recon task status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReconTaskStatus'

  /api/recon/{task_id}/results:
    get:
      tags: [Reconnaissance]
      operationId: getReconResults
      summary: Get recon results
      parameters:
        - $ref: '#/components/parameters/TaskId'
      responses:
        '200':
          description: Reconnaissance results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReconResults'

  # ──────────────────────────────────────────────
  # Port Scanning (v1)
  # ──────────────────────────────────────────────

  /api/port-scan/scan:
    post:
      tags: [Port Scanning]
      operationId: startPortScan
      summary: Start a port scan
      description: Launches an asynchronous Naabu port scan against the specified target.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PortScanRequest'
      responses:
        '202':
          description: Port scan task accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskResponse'

  /api/port-scan/status/{task_id}:
    get:
      tags: [Port Scanning]
      operationId: getPortScanStatus
      summary: Get port scan status
      parameters:
        - $ref: '#/components/parameters/TaskId'
      responses:
        '200':
          description: Port scan task status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScanTaskStatus'

  /api/port-scan/results/{task_id}:
    get:
      tags: [Port Scanning]
      operationId: getPortScanResults
      summary: Get port scan results
      parameters:
        - $ref: '#/components/parameters/TaskId'
      responses:
        '200':
          description: Port scan results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortScanResults'

  /api/port-scan/tasks/{task_id}:
    delete:
      tags: [Port Scanning]
      operationId: cancelPortScanTask
      summary: Cancel a port scan task
      parameters:
        - $ref: '#/components/parameters/TaskId'
      responses:
        '204':
          description: Task cancelled

  /api/port-scan/tasks:
    get:
      tags: [Port Scanning]
      operationId: listPortScanTasks
      summary: List all port scan tasks
      responses:
        '200':
          description: List of scan tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ScanTaskStatus'

  # ──────────────────────────────────────────────
  # HTTP Probing
  # ──────────────────────────────────────────────

  /api/http-probe:
    post:
      tags: [HTTP Probing]
      operationId: startHttpProbe
      summary: Start an HTTP probe task
      description: Probes HTTP/HTTPS services on discovered hosts to fingerprint technologies, headers, and status codes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HttpProbeRequest'
      responses:
        '202':
          description: HTTP probe task accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskResponse'

  /api/http-probe/{task_id}:
    get:
      tags: [HTTP Probing]
      operationId: getHttpProbeStatus
      summary: Get HTTP probe task status
      parameters:
        - $ref: '#/components/parameters/TaskId'
      responses:
        '200':
          description: HTTP probe task status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpProbeTaskStatus'

  /api/http-probe/{task_id}/results:
    get:
      tags: [HTTP Probing]
      operationId: getHttpProbeResults
      summary: Get HTTP probe results
      parameters:
        - $ref: '#/components/parameters/TaskId'
      responses:
        '200':
          description: HTTP probe results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HttpProbeResults'

  # ──────────────────────────────────────────────
  # Port Scans v2
  # ──────────────────────────────────────────────

  /api/scans/ports:
    post:
      tags: [Scans]
      operationId: createPortScanV2
      summary: Create a port scan (v2)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PortScanRequest'
      responses:
        '202':
          description: Port scan task accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskResponse'

  /api/scans/ports/{task_id}:
    get:
      tags: [Scans]
      operationId: getPortScanV2
      summary: Get port scan status (v2)
      parameters:
        - $ref: '#/components/parameters/TaskId'
      responses:
        '200':
          description: Port scan status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScanTaskStatus'

  /api/scans/ports/{task_id}/results:
    get:
      tags: [Scans]
      operationId: getPortScanResultsV2
      summary: Get port scan results (v2)
      parameters:
        - $ref: '#/components/parameters/TaskId'
      responses:
        '200':
          description: Port scan results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortScanResults'

  # ──────────────────────────────────────────────
  # Nuclei Scans
  # ──────────────────────────────────────────────

  /api/scans/nuclei:
    post:
      tags: [Scans]
      operationId: createNucleiScan
      summary: Create a Nuclei vulnerability scan
      description: Runs Nuclei template-based vulnerability detection against the specified targets.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NucleiScanRequest'
      responses:
        '202':
          description: Nuclei scan task accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskResponse'

  /api/scans/nuclei/{task_id}:
    get:
      tags: [Scans]
      operationId: getNucleiScan
      summary: Get Nuclei scan status
      parameters:
        - $ref: '#/components/parameters/TaskId'
      responses:
        '200':
          description: Nuclei scan status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScanTaskStatus'

  /api/scans/nuclei/{task_id}/results:
    get:
      tags: [Scans]
      operationId: getNucleiScanResults
      summary: Get Nuclei scan results
      parameters:
        - $ref: '#/components/parameters/TaskId'
      responses:
        '200':
          description: Nuclei scan results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NucleiScanResults'

  # ──────────────────────────────────────────────
  # URL Discovery
  # ──────────────────────────────────────────────

  /api/discovery/urls:
    post:
      tags: [URL Discovery]
      operationId: startUrlDiscovery
      summary: Start URL discovery
      description: Launches FFuf-backed URL and directory discovery against the target.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UrlDiscoveryRequest'
      responses:
        '202':
          description: URL discovery task accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskResponse'

