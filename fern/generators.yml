default-group: local

groups:
  # ──────────────────────────────────────────────────────────────────────────
  # local — run during development to regenerate client stubs locally
  # ──────────────────────────────────────────────────────────────────────────
  local:
    generators:
      - name: fernapi/fern-python-sdk
        version: 4.1.0
        output:
          location: local-file-system
          path: ../sdks/python
        config:
          package_name: univex
          client_class_name: UniVexClient
          async_client_class_name: AsyncUniVexClient
          use_typeddict_requests: true
          pydantic_config:
            use_pydantic_v2: true
            base_model: pydantic.BaseModel

      - name: fernapi/fern-typescript-node-sdk
        version: 0.39.0
        output:
          location: local-file-system
          path: ../sdks/typescript
        config:
          packageName: "@bitr1ft/univex"
          namespaceExport: UniVex
          useBrandedStringAliases: false
          includeCredentialsOnCrossOriginRequests: false

  # ──────────────────────────────────────────────────────────────────────────
  # release — triggered by GitHub Actions on every tagged release
  # Publishes Python SDK to PyPI and TypeScript SDK to npm.
  # ──────────────────────────────────────────────────────────────────────────
  release:
    generators:
      - name: fernapi/fern-python-sdk
        version: 4.1.0
        output:
          location: pypi
          package-name: univex-sdk
          token: ${PYPI_TOKEN}
        config:
          package_name: univex
          client_class_name: UniVexClient
          async_client_class_name: AsyncUniVexClient
          use_typeddict_requests: true
          pydantic_config:
            use_pydantic_v2: true
            base_model: pydantic.BaseModel

      - name: fernapi/fern-typescript-node-sdk
        version: 0.39.0
        output:
          location: npm
          package-name: "@bitr1ft/univex"
          token: ${NPM_TOKEN}
        config:
          packageName: "@bitr1ft/univex"
          namespaceExport: UniVex
          useBrandedStringAliases: false
          includeCredentialsOnCrossOriginRequests: false

      - name: fernapi/fern-openapi
        version: 0.0.29
        output:
          location: local-file-system
          path: ../fern/openapi
        config:
          format: openapi
          openapi-version: "3.1.0"
