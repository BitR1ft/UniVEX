# ==============================================================================
# UniVex — Full Observability Stack
# Day 13: VictoriaMetrics (long-term metrics) & ClickHouse (analytics)
# Day 12: Loki Log Aggregation & Jaeger Distributed Tracing
#
# Standalone observability stack — does NOT depend on docker-compose.yml.
# Start alongside the main stack:
#   docker compose -f docker-compose.yml -f docker-compose-observability.yml up -d
#
# Or standalone (for development):
#   docker compose -f docker-compose-observability.yml up -d
#
# Included services:
#   - Grafana Loki          — structured log aggregation (port 3100)
#   - Promtail              — log shipper (Docker container logs → Loki)
#   - Jaeger All-in-One     — distributed tracing UI + OTLP receiver (port 16686)
#   - Grafana               — dashboards for logs, traces, and metrics (port 3000)
#   - Prometheus            — metrics scraping layer (port 9090)
#   - VictoriaMetrics       — high-performance long-term metrics store (port 8428)
#   - ClickHouse            — columnar analytics database (port 8123/9000)
#
# Dashboards:
#   Grafana:         http://localhost:3000 (admin / admin — change on first login)
#   Jaeger:          http://localhost:16686
#   Loki:            http://localhost:3100/ready
#   VictoriaMetrics: http://localhost:8428/vmui
#   ClickHouse HTTP: http://localhost:8123
# ==============================================================================

services:
  # ============================================================================
  # Grafana Loki — Structured Log Aggregation
  # ============================================================================
  loki:
    image: grafana/loki:3.4.2
    container_name: univex-loki
    restart: unless-stopped
    command: -config.file=/etc/loki/loki-config.yaml
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - ./docker/observability/loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - loki-data:/loki
    networks:
      - observability-network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3100/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.1'
          memory: 256M

  # ============================================================================
  # Promtail — Log Shipper (Docker container logs → Loki)
  # ============================================================================
  promtail:
    image: grafana/promtail:3.4.2
    container_name: univex-promtail
    restart: unless-stopped
    command: -config.file=/etc/promtail/promtail-config.yaml
    volumes:
      - ./docker/observability/promtail/promtail-config.yaml:/etc/promtail/promtail-config.yaml:ro
      - /var/log:/var/log:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /run/docker.sock:/run/docker.sock:ro
    networks:
      - observability-network
    depends_on:
      loki:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  # ============================================================================
  # Jaeger All-in-One — Distributed Tracing UI
  # Receives traces via OTLP (gRPC port 4317, HTTP port 4318)
  # ============================================================================
  jaeger:
    image: jaegertracing/all-in-one:1.65
    container_name: univex-jaeger
    restart: unless-stopped
    environment:
      # Use in-memory storage for development.
      # For production: set SPAN_STORAGE_TYPE=elasticsearch or cassandra.
      SPAN_STORAGE_TYPE: memory
      MEMORY_MAX_TRACES: "10000"
      # OTEL collector
      COLLECTOR_OTLP_ENABLED: "true"
      # Propagation formats
      JAEGER_PROPAGATION: jaeger,w3c
      # Log sampling
      LOG_LEVEL: info
    ports:
      - "127.0.0.1:16686:16686"   # Jaeger UI
      - "127.0.0.1:4317:4317"     # OTLP gRPC (used by UniVex backend)
      - "127.0.0.1:4318:4318"     # OTLP HTTP
      - "127.0.0.1:9411:9411"     # Zipkin-compatible receiver
    networks:
      - observability-network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:16686 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G

  # ============================================================================
  # Grafana — Dashboards for Logs (Loki), Traces (Jaeger), Metrics (VictoriaMetrics/Prometheus)
  # ============================================================================
  grafana:
    image: grafana/grafana:11.6.0
    container_name: univex-grafana
    restart: unless-stopped
    depends_on:
      loki:
        condition: service_healthy
      jaeger:
        condition: service_healthy
      victoriametrics:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: "${GRAFANA_ADMIN_USER:-admin}"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:-admin}"
      GF_SERVER_DOMAIN: "localhost"
      GF_SERVER_ROOT_URL: "http://localhost:3000"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      # Enable unified alerting
      GF_UNIFIED_ALERTING_ENABLED: "true"
      GF_ALERTING_ENABLED: "false"
      # Install extra plugins (ClickHouse datasource included)
      GF_INSTALL_PLUGINS: "grafana-clock-panel,grafana-polystat-panel,grafana-clickhouse-datasource"
      # Datasource URLs (internal network)
      LOKI_URL: "http://loki:3100"
      JAEGER_URL: "http://jaeger:16686"
      PROMETHEUS_URL: "http://prometheus:9090"
      # VictoriaMetrics is the primary metrics datasource
      VICTORIAMETRICS_URL: "http://victoriametrics:8428"
      CLICKHOUSE_HOST: "clickhouse"
      CLICKHOUSE_PORT: "9000"
    volumes:
      - ./docker/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    networks:
      - observability-network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M

  # ============================================================================
  # Prometheus — Metrics scraping layer
  # Remote-writes to VictoriaMetrics for long-term storage.
  # ============================================================================
  prometheus:
    image: prom/prometheus:v3.2.0
    container_name: univex-prometheus-obs
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=2d"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
      - "--web.enable-admin-api"
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./docker/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - observability-network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:9090/-/healthy || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G

  # ============================================================================
  # VictoriaMetrics — High-Performance Long-Term Metrics Store
  # Day 13: Acts as the primary metrics store; Prometheus remote-writes here.
  # Grafana queries VictoriaMetrics instead of Prometheus for dashboards.
  # UI: http://localhost:8428/vmui
  # ============================================================================
  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.115.0
    container_name: univex-victoriametrics
    restart: unless-stopped
    command:
      - "--storageDataPath=/victoria-metrics-data"
      - "--httpListenAddr=:8428"
      - "--retentionPeriod=12"        # 12 months retention
      - "--selfScrapeInterval=10s"    # Self-monitoring
      - "--promscrape.config=/etc/victoriametrics/scrape-config.yaml"
      - "--promscrape.suppressDuplicateScrapeTargetErrors"
      - "--search.maxQueryDuration=30s"
      - "--search.maxConcurrentRequests=16"
      - "--loggerLevel=INFO"
    ports:
      - "127.0.0.1:8428:8428"
    volumes:
      - ./docker/observability/victoriametrics/scrape-config.yaml:/etc/victoriametrics/scrape-config.yaml:ro
      - victoriametrics-data:/victoria-metrics-data
    networks:
      - observability-network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8428/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.25'
          memory: 256M

  # ============================================================================
  # ClickHouse — Columnar Analytics Database
  # Day 13: Stores historical pentest data (agent_runs, tool_executions,
  # findings, scan_sessions, llm_calls).  Initialized with init.sql.
  # HTTP interface: http://localhost:8123
  # Native TCP:     localhost:9000
  # ============================================================================
  clickhouse:
    image: clickhouse/clickhouse-server:24.12.4-alpine
    container_name: univex-clickhouse
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: "${CLICKHOUSE_DATABASE:-univex}"
      CLICKHOUSE_USER: "${CLICKHOUSE_USER:-default}"
      CLICKHOUSE_PASSWORD: "${CLICKHOUSE_PASSWORD:-}"
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "127.0.0.1:8123:8123"    # HTTP interface
      - "127.0.0.1:9000:9000"    # Native TCP (used by clickhouse-driver)
      - "127.0.0.1:9363:9363"    # Prometheus metrics endpoint
    volumes:
      - ./docker/observability/clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - clickhouse-data:/var/lib/clickhouse
      - clickhouse-logs:/var/log/clickhouse-server
    networks:
      - observability-network
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '0.5'
          memory: 1G

# ==============================================================================
# Volumes
# ==============================================================================
volumes:
  loki-data:
    driver: local
  grafana-data:
    driver: local
  prometheus-data:
    driver: local
  victoriametrics-data:
    driver: local
    name: univex-victoriametrics-data
  clickhouse-data:
    driver: local
    name: univex-clickhouse-data
  clickhouse-logs:
    driver: local
    name: univex-clickhouse-logs

# ==============================================================================
# Networks
# ==============================================================================
networks:
  observability-network:
    driver: bridge
    name: univex-observability
