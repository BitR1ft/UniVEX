# UniVex ctester — Benchmark Test Groups
# ─────────────────────────────────────────────────────────────────────────────
# Four standardised groups covering the full UniVex agent surface.
#
# Schema per task:
#   id:                 Stable unique identifier (kebab-case)
#   name:               Short human-readable label
#   description:        What this task tests
#   agent_role:         One of the 13 UniVex agent roles
#   input_prompt:       The exact prompt submitted to the agent
#   expected_keywords:  Strings that MUST appear in a passing response
#   expected_tool_calls: Tool names expected to be invoked (optional)
#   max_latency_ms:     Hard upper bound — failure if exceeded
#   tags:               Free-form categorisation labels
# ─────────────────────────────────────────────────────────────────────────────

groups:

  # ──────────────────────────────────────────────────────────────────────────
  - name: group_recon
    description: "Reconnaissance & OSINT — 10 tasks covering passive + active recon"
    tasks:

      - id: recon-01-port-scan
        name: "Port scan 192.168.1.1"
        description: "Agent should invoke a port-scanning tool and summarise open ports"
        agent_role: recon
        input_prompt: >
          Perform a full TCP port scan on 192.168.1.1 and list all open ports
          with service banners.
        expected_keywords:
          - port
          - open
          - tcp
        expected_tool_calls:
          - naabu
        max_latency_ms: 20000
        tags: [network, port-scan]

      - id: recon-02-subdomain-enum
        name: "Subdomain enumeration for example.com"
        description: "Passive subdomain discovery via OSINT sources"
        agent_role: recon
        input_prompt: >
          Enumerate subdomains for example.com using passive DNS sources and
          certificate transparency logs.
        expected_keywords:
          - subdomain
          - dns
          - example.com
        max_latency_ms: 25000
        tags: [osint, dns]

      - id: recon-03-http-probe
        name: "HTTP probe on 10.0.0.5:8080"
        description: "Agent should probe the HTTP service and identify status codes"
        agent_role: recon
        input_prompt: >
          Probe the HTTP service on 10.0.0.5:8080 and report the status code,
          server header, and any redirects.
        expected_keywords:
          - status
          - header
          - http
        expected_tool_calls:
          - curl
        max_latency_ms: 15000
        tags: [http, probing]

      - id: recon-04-web-search-osint
        name: "OSINT web search for target organisation"
        description: "Use web search to gather OSINT about a fictional organisation"
        agent_role: recon
        input_prompt: >
          Use web search to find public information about Acme Corp —
          employees, technologies used, and any public security advisories.
        expected_keywords:
          - acme
          - employees
          - technology
        expected_tool_calls:
          - web_search
        max_latency_ms: 20000
        tags: [osint, web-search]

      - id: recon-05-tech-fingerprint
        name: "Technology fingerprinting on https://target.local"
        description: "Identify web frameworks, CMS, and server software"
        agent_role: recon
        input_prompt: >
          Identify the web technologies, frameworks, and CMS used on
          https://target.local.
        expected_keywords:
          - framework
          - technology
          - fingerprint
        max_latency_ms: 20000
        tags: [fingerprinting]

      - id: recon-06-directory-fuzz
        name: "Directory fuzzing on https://target.local/api"
        description: "Fuzz for hidden directories and files"
        agent_role: recon
        input_prompt: >
          Fuzz for hidden directories and configuration files on
          https://target.local/api using a standard wordlist.
        expected_keywords:
          - directory
          - wordlist
          - found
        expected_tool_calls:
          - ffuf_fuzz_dirs
        max_latency_ms: 30000
        tags: [fuzzing]

      - id: recon-07-snmp-enum
        name: "SNMP community string enumeration"
        description: "Enumerate SNMP community strings on 10.0.0.10"
        agent_role: recon
        input_prompt: >
          Enumerate SNMP community strings on 10.0.0.10 and retrieve
          system information if accessible.
        expected_keywords:
          - snmp
          - community
          - oid
        expected_tool_calls:
          - snmp
        max_latency_ms: 20000
        tags: [snmp, network]

      - id: recon-08-wpscan
        name: "WordPress vulnerability scan on https://blog.target.local"
        description: "Enumerate WordPress plugins, themes, and vulnerabilities"
        agent_role: recon
        input_prompt: >
          Run a WordPress scan on https://blog.target.local to enumerate
          installed plugins, themes, and any known CVEs.
        expected_keywords:
          - wordpress
          - plugin
          - vulnerability
        expected_tool_calls:
          - wpscan
        max_latency_ms: 25000
        tags: [cms, wordpress]

      - id: recon-09-graph-query
        name: "Knowledge graph query for target host"
        description: "Query the knowledge graph for previously stored recon data"
        agent_role: recon
        input_prompt: >
          Query the UniVex knowledge graph for all stored information about
          192.168.1.1 and produce a structured summary.
        expected_keywords:
          - graph
          - knowledge
          - host
        expected_tool_calls:
          - query_graph
        max_latency_ms: 10000
        tags: [knowledge-graph]

      - id: recon-10-ldap-enum
        name: "LDAP enumeration on Active Directory"
        description: "Enumerate LDAP users and groups on a domain controller"
        agent_role: recon
        input_prompt: >
          Perform LDAP enumeration on dc.corp.local:389 to discover
          user accounts, groups, and domain policy information.
        expected_keywords:
          - ldap
          - user
          - domain
        expected_tool_calls:
          - ldap_enum
        max_latency_ms: 20000
        tags: [active-directory, ldap]

  # ──────────────────────────────────────────────────────────────────────────
  - name: group_exploit
    description: "Exploitation — 10 tasks covering OWASP Top 10 attack scenarios"
    tasks:

      - id: exploit-01-sqli
        name: "SQL injection enumeration"
        description: "Test for SQL injection on a login endpoint (OWASP A03)"
        agent_role: exploit
        input_prompt: >
          Exploit a SQL injection vulnerability on the login endpoint
          POST /api/login with parameters username and password.
          Extract the first 3 user records from the users table.
        expected_keywords:
          - sql
          - injection
          - users
        max_latency_ms: 25000
        tags: [sqli, owasp-a03]

      - id: exploit-02-xss
        name: "Stored XSS in comment field"
        description: "Exploit a stored XSS vulnerability (OWASP A03)"
        agent_role: exploit
        input_prompt: >
          Craft a stored XSS payload for the comment field at
          POST /api/comments that will execute when an admin views comments.
        expected_keywords:
          - xss
          - payload
          - script
        max_latency_ms: 20000
        tags: [xss, owasp-a03]

      - id: exploit-03-idor
        name: "IDOR — access another user's profile"
        description: "Exploit an IDOR to access user data (OWASP A01)"
        agent_role: exploit
        input_prompt: >
          Exploit an Insecure Direct Object Reference (IDOR) vulnerability
          at GET /api/users/{id}/profile to access user ID 100's data
          while authenticated as user ID 42.
        expected_keywords:
          - idor
          - user
          - access
        max_latency_ms: 20000
        tags: [idor, owasp-a01]

      - id: exploit-04-command-injection
        name: "OS command injection via filename"
        description: "Exploit command injection in a file upload endpoint"
        agent_role: exploit
        input_prompt: >
          Exploit an OS command injection vulnerability in the file name
          parameter of POST /api/upload. Execute `id` and return the output.
        expected_keywords:
          - command
          - injection
          - execute
        max_latency_ms: 20000
        tags: [cmdi, owasp-a03]

      - id: exploit-05-broken-auth
        name: "Brute-force weak JWT secret"
        description: "Broken authentication via JWT with weak secret (OWASP A07)"
        agent_role: exploit
        input_prompt: >
          A JWT is using HS256 with a weak secret. Crack the secret using a
          wordlist and forge a token with admin role.
        expected_keywords:
          - jwt
          - secret
          - forge
        max_latency_ms: 25000
        tags: [auth, jwt, owasp-a07]

      - id: exploit-06-ssrf
        name: "SSRF to reach internal metadata endpoint"
        description: "Exploit SSRF to access cloud metadata service (OWASP A10)"
        agent_role: exploit
        input_prompt: >
          Exploit a Server-Side Request Forgery (SSRF) vulnerability at
          POST /api/fetch?url= to reach the AWS metadata endpoint at
          169.254.169.254 and extract IAM credentials.
        expected_keywords:
          - ssrf
          - metadata
          - internal
        max_latency_ms: 20000
        tags: [ssrf, owasp-a10]

      - id: exploit-07-xxe
        name: "XXE to read /etc/passwd"
        description: "Exploit XML external entity injection (OWASP A05)"
        agent_role: exploit
        input_prompt: >
          Exploit an XML External Entity (XXE) vulnerability in the
          XML parsing endpoint POST /api/import to read /etc/passwd.
        expected_keywords:
          - xxe
          - entity
          - passwd
        max_latency_ms: 20000
        tags: [xxe, owasp-a05]

      - id: exploit-08-path-traversal
        name: "Path traversal in file download"
        description: "Directory traversal to read sensitive files (OWASP A01)"
        agent_role: exploit
        input_prompt: >
          Exploit a path traversal vulnerability at GET /api/download?file=
          to read /etc/shadow using directory traversal sequences.
        expected_keywords:
          - traversal
          - path
          - directory
        max_latency_ms: 20000
        tags: [path-traversal, owasp-a01]

      - id: exploit-09-deserialization
        name: "Insecure Java deserialization RCE"
        description: "Exploit Java deserialization for remote code execution (OWASP A08)"
        agent_role: exploit
        input_prompt: >
          Exploit an insecure Java deserialization endpoint at
          POST /api/session/restore. Generate a ysoserial payload to
          execute `whoami` on the server.
        expected_keywords:
          - deserialization
          - ysoserial
          - payload
        max_latency_ms: 30000
        tags: [deserialization, rce, owasp-a08]

      - id: exploit-10-csrf
        name: "CSRF token bypass for account takeover"
        description: "Craft CSRF payload to change admin password (OWASP A01)"
        agent_role: exploit
        input_prompt: >
          Craft a CSRF payload that bypasses weak CSRF token validation on
          POST /api/account/password to change the admin's password.
        expected_keywords:
          - csrf
          - token
          - bypass
        max_latency_ms: 20000
        tags: [csrf, owasp-a01]

  # ──────────────────────────────────────────────────────────────────────────
  - name: group_report
    description: "Report generation — 5 tasks for structured security reporting"
    tasks:

      - id: report-01-executive-summary
        name: "Executive summary for C-suite"
        description: "Generate a concise executive summary from scan results"
        agent_role: report
        input_prompt: >
          Generate a 3-paragraph executive summary for a penetration test
          of Acme Corp's web application. Critical findings: SQL injection
          on login, stored XSS in comments, exposed admin panel.
          Risk level: CRITICAL.
        expected_keywords:
          - executive
          - critical
          - risk
        max_latency_ms: 15000
        tags: [executive, summary]

      - id: report-02-technical-findings
        name: "Technical findings section"
        description: "Generate a detailed technical findings section with CVSS scores"
        agent_role: report
        input_prompt: >
          Write a detailed technical findings section for the following
          vulnerabilities: SQL injection (CVE-2021-44228), stored XSS,
          and directory traversal. Include CVSS v3.1 scores and remediation
          steps for each finding.
        expected_keywords:
          - cvss
          - remediation
          - finding
        max_latency_ms: 20000
        tags: [technical, cvss]

      - id: report-03-remediation-roadmap
        name: "Prioritised remediation roadmap"
        description: "Create a prioritised remediation plan with timelines"
        agent_role: report
        input_prompt: >
          Create a prioritised remediation roadmap for 5 findings:
          2 critical, 1 high, 1 medium, 1 low. Include recommended
          timelines (immediate/30-day/90-day) and owner assignments.
        expected_keywords:
          - remediation
          - priority
          - timeline
        max_latency_ms: 15000
        tags: [remediation, planning]

      - id: report-04-compliance-mapping
        name: "Map findings to OWASP Top 10 and CWE"
        description: "Map discovered vulnerabilities to compliance frameworks"
        agent_role: report
        input_prompt: >
          Map the following vulnerabilities to OWASP Top 10 2021 categories
          and CWE IDs: SQL injection, XSS, SSRF, broken authentication,
          path traversal.
        expected_keywords:
          - owasp
          - cwe
          - mapping
        max_latency_ms: 15000
        tags: [compliance, owasp, cwe]

      - id: report-05-proof-of-concept
        name: "PoC reproduction steps"
        description: "Document step-by-step reproduction steps for a vulnerability"
        agent_role: report
        input_prompt: >
          Write step-by-step proof-of-concept reproduction steps for a
          stored XSS vulnerability found in the comment field at
          POST /api/comments. Include screenshots placeholder and request/
          response examples.
        expected_keywords:
          - proof-of-concept
          - reproduction
          - request
        max_latency_ms: 15000
        tags: [poc, documentation]

  # ──────────────────────────────────────────────────────────────────────────
  - name: group_reasoning
    description: "Complex multi-step reasoning — 5 advanced orchestration tasks"
    tasks:

      - id: reasoning-01-attack-chain
        name: "Full attack chain planning"
        description: "Orchestrator plans a complete multi-stage attack chain"
        agent_role: orchestrator
        input_prompt: >
          Plan a complete multi-stage attack chain for a target web application
          at https://target.corp. Starting from unauthenticated access,
          describe the steps to achieve domain admin compromise.
          Include recon, initial access, privilege escalation, and lateral
          movement stages.
        expected_keywords:
          - recon
          - privilege
          - lateral
          - attack
        max_latency_ms: 30000
        tags: [planning, multi-stage]

      - id: reasoning-02-tool-selection
        name: "Adaptive tool selection under constraints"
        description: "Agent must select optimal tools given network constraints"
        agent_role: orchestrator
        input_prompt: >
          You are attacking a target network where ICMP is blocked,
          ports 80 and 443 are open, and you have 15 minutes.
          Which tools would you run, in what order, and why?
          Justify each tool choice based on the constraints.
        expected_keywords:
          - tool
          - port
          - justify
        max_latency_ms: 20000
        tags: [tool-selection, reasoning]

      - id: reasoning-03-false-positive-triage
        name: "False positive triage for scanner output"
        description: "Reflector agent triages 20 scanner alerts for false positives"
        agent_role: reflector
        input_prompt: >
          You have received 20 alerts from a vulnerability scanner.
          15 are real vulnerabilities (SQL injection, XSS, SSRF) and
          5 are false positives (rate limiting misidentified as DoS,
          debug headers misidentified as info disclosure).
          Analyse and filter the false positives with reasoning.
        expected_keywords:
          - false positive
          - vulnerability
          - filter
        max_latency_ms: 25000
        tags: [triage, analysis]

      - id: reasoning-04-risk-assessment
        name: "Contextual risk assessment for dual findings"
        description: "Adviser provides risk assessment considering business context"
        agent_role: adviser
        input_prompt: >
          Two critical findings were identified: (1) SQL injection on the
          public login page affecting 50,000 users, (2) hardcoded SSH key
          in an internal CI/CD pipeline accessed only by 5 engineers.
          Provide a contextual risk assessment considering business impact,
          exploitability, and remediation priority.
        expected_keywords:
          - risk
          - business
          - impact
          - priority
        max_latency_ms: 20000
        tags: [risk, business-context]

      - id: reasoning-05-payload-refinement
        name: "Multi-round payload refinement loop"
        description: "Refiner agent iteratively improves a failed XSS payload"
        agent_role: refiner
        input_prompt: >
          The following XSS payloads were blocked by a WAF:
          <script>alert(1)</script> and <img src=x onerror=alert(1)>.
          The WAF blocks 'script', 'onerror', and 'alert'.
          Generate 3 alternative bypass payloads with reasoning for each.
        expected_keywords:
          - waf
          - bypass
          - payload
          - xss
        max_latency_ms: 20000
        tags: [payload, waf-bypass, refinement]
