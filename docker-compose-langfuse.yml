# ==============================================================================
# UniVex — Langfuse Self-Hosted Observability Stack
# Day 11: Langfuse LLM Observability
#
# Usage:
#   docker compose -f docker-compose-langfuse.yml up -d
#
# Environment variables (set in .env or pass -e):
#   LANGFUSE_DB_PASSWORD        — PostgreSQL password for Langfuse (required)
#   LANGFUSE_NEXTAUTH_SECRET    — NextAuth secret (min 32 chars, required)
#   LANGFUSE_SALT               — Hashing salt (min 32 chars, required)
#   LANGFUSE_PUBLIC_KEY         — SDK public key (auto-generated by Langfuse UI)
#   LANGFUSE_SECRET_KEY         — SDK secret key (auto-generated by Langfuse UI)
#
# After starting, open http://localhost:3001 to create your first project and
# obtain the PUBLIC_KEY + SECRET_KEY for the UniVex backend .env file.
# ==============================================================================

services:
  # ============================================================================
  # Langfuse Server
  # ============================================================================
  langfuse:
    image: langfuse/langfuse:3
    container_name: univex-langfuse
    restart: unless-stopped
    depends_on:
      langfuse-postgres:
        condition: service_healthy
      langfuse-clickhouse:
        condition: service_healthy
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      # --- Database ---
      DATABASE_URL: "postgresql://langfuse:${LANGFUSE_DB_PASSWORD:-langfuse_dev_password}@langfuse-postgres:5432/langfuse"

      # --- ClickHouse (event analytics & trace storage) ---
      CLICKHOUSE_MIGRATION_URL: "clickhouse://langfuse-clickhouse:9000"
      CLICKHOUSE_URL: "http://langfuse-clickhouse:8123"
      CLICKHOUSE_USER: "default"
      CLICKHOUSE_PASSWORD: "${LANGFUSE_CLICKHOUSE_PASSWORD:-langfuse_ch_password}"

      # --- Auth ---
      NEXTAUTH_SECRET: "${LANGFUSE_NEXTAUTH_SECRET:-changeme-generate-a-32-char-secret!!}"
      SALT: "${LANGFUSE_SALT:-changeme-generate-a-32-char-salt!!!}"
      NEXTAUTH_URL: "http://localhost:3001"
      HOSTNAME: "0.0.0.0"

      # --- App Config ---
      TELEMETRY_ENABLED: "false"
      LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES: "false"
      # Disable sign-ups in production — set to "false" after creating first user
      AUTH_DISABLE_SIGNUP: "${LANGFUSE_DISABLE_SIGNUP:-false}"

      # --- Caching (optional Redis) ---
      # LANGFUSE_CACHE_API_RESPONSE_ENABLED: "true"
      # REDIS_CONNECTION_STRING: "redis://redis:6379"

      # --- Blob storage (optional MinIO) ---
      # LANGFUSE_S3_ENABLED: "true"
      # LANGFUSE_S3_BUCKET: "langfuse"
      # LANGFUSE_S3_REGION: "us-east-1"
      # LANGFUSE_S3_ACCESS_KEY_ID: "minioadmin"
      # LANGFUSE_S3_SECRET_ACCESS_KEY: "minioadmin"
      # LANGFUSE_S3_ENDPOINT: "http://minio:9000"
      # LANGFUSE_S3_FORCE_PATH_STYLE: "true"

    networks:
      - langfuse-network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/public/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.25'
          memory: 512M

  # ============================================================================
  # Langfuse PostgreSQL
  # Separate from the main UniVex PostgreSQL to avoid schema conflicts.
  # ============================================================================
  langfuse-postgres:
    image: postgres:16-alpine
    container_name: univex-langfuse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: "${LANGFUSE_DB_PASSWORD:-langfuse_dev_password}"
      POSTGRES_DB: langfuse
    volumes:
      - langfuse-postgres-data:/var/lib/postgresql/data
    networks:
      - langfuse-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langfuse -d langfuse"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G

  # ============================================================================
  # ClickHouse — columnar event storage for Langfuse traces & generations
  # ============================================================================
  langfuse-clickhouse:
    image: clickhouse/clickhouse-server:24-alpine
    container_name: univex-langfuse-clickhouse
    restart: unless-stopped
    environment:
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
      CLICKHOUSE_PASSWORD: "${LANGFUSE_CLICKHOUSE_PASSWORD:-langfuse_ch_password}"
    volumes:
      - langfuse-clickhouse-data:/var/lib/clickhouse
      - langfuse-clickhouse-logs:/var/log/clickhouse-server
    networks:
      - langfuse-network
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --query='SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '0.5'
          memory: 1G

# ==============================================================================
# Volumes
# ==============================================================================
volumes:
  langfuse-postgres-data:
    driver: local
  langfuse-clickhouse-data:
    driver: local
  langfuse-clickhouse-logs:
    driver: local

# ==============================================================================
# Networks
# ==============================================================================
networks:
  langfuse-network:
    driver: bridge
    name: univex-langfuse
