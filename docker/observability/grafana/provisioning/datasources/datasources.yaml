# ==============================================================================
# Grafana Datasource Provisioning — UniVex Observability
# Automatically configures Loki, Jaeger, and Prometheus datasources.
# ==============================================================================

apiVersion: 1

datasources:
  # --------------------------------------------------------------------------
  # Grafana Loki — Structured Logs
  # --------------------------------------------------------------------------
  - name: Loki
    type: loki
    uid: loki
    access: proxy
    url: http://loki:3100
    isDefault: false
    version: 1
    editable: false
    jsonData:
      maxLines: 5000
      derivedFields:
        # Link trace_id in Loki logs to Jaeger traces
        - datasourceUid: jaeger
          matcherRegex: '"trace_id":"([a-f0-9]{32})"'
          name: TraceID
          url: "$${__value.raw}"
          urlDisplayLabel: "View Trace in Jaeger"

  # --------------------------------------------------------------------------
  # Jaeger — Distributed Traces
  # --------------------------------------------------------------------------
  - name: Jaeger
    type: jaeger
    uid: jaeger
    access: proxy
    url: http://jaeger:16686
    isDefault: false
    version: 1
    editable: false
    jsonData:
      tracesToLogsV2:
        datasourceUid: loki
        filterByTraceID: true
        filterBySpanID: false
        tags:
          - key: service.name
            value: service
      nodeGraph:
        enabled: true

  # --------------------------------------------------------------------------
  # Prometheus — Metrics
  # --------------------------------------------------------------------------
  - name: Prometheus
    type: prometheus
    uid: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    version: 1
    editable: false
    jsonData:
      timeInterval: "15s"
      queryTimeout: "60s"
      httpMethod: POST
