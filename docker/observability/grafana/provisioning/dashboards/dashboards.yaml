# ==============================================================================
# Grafana Dashboard Provisioning — UniVex Observability
# Loads pre-built dashboards from the /var/lib/grafana/dashboards directory.
# ==============================================================================

apiVersion: 1

providers:
  - name: UniVex Dashboards
    orgId: 1
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: true
