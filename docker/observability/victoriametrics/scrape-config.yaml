# ==============================================================================
# VictoriaMetrics — Scrape Configuration
# Day 13: VictoriaMetrics replaces Prometheus as the long-term metrics store.
# Prometheus remains as the scrape layer and remote_writes here.
# This file is mounted into the VictoriaMetrics container to define its
# own scrape targets (vmagent mode) for direct scraping.
# ==============================================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: "univex-production"
    env: "production"

# ==============================================================================
# Scrape configurations for all UniVex services
# ==============================================================================
scrape_configs:

  # ----------------------------------------------------------------------------
  # UniVex FastAPI Backend
  # ----------------------------------------------------------------------------
  - job_name: "univex-api"
    static_configs:
      - targets: ["backend:8000"]
        labels:
          service: "backend"
          component: "api"
    metrics_path: "/metrics"
    scrape_interval: 10s
    scrape_timeout: 8s

  # ----------------------------------------------------------------------------
  # Nginx Reverse Proxy (requires nginx-prometheus-exporter sidecar)
  # ----------------------------------------------------------------------------
  - job_name: "univex-nginx"
    static_configs:
      - targets: ["nginx:9113"]
        labels:
          service: "nginx"
          component: "proxy"
    scrape_interval: 30s

  # ----------------------------------------------------------------------------
  # Redis — redis_exporter
  # ----------------------------------------------------------------------------
  - job_name: "univex-redis"
    static_configs:
      - targets: ["redis-exporter:9121"]
        labels:
          service: "redis"
          component: "cache"
    scrape_interval: 30s

  # ----------------------------------------------------------------------------
  # PostgreSQL — postgres_exporter
  # ----------------------------------------------------------------------------
  - job_name: "univex-postgres"
    static_configs:
      - targets: ["postgres-exporter:9187"]
        labels:
          service: "postgres"
          component: "database"
    scrape_interval: 30s

  # ----------------------------------------------------------------------------
  # Neo4j Graph Database — neo4j-prometheus endpoint (built-in)
  # ----------------------------------------------------------------------------
  - job_name: "univex-neo4j"
    static_configs:
      - targets: ["neo4j:2004"]
        labels:
          service: "neo4j"
          component: "graph-database"
    scrape_interval: 30s

  # ----------------------------------------------------------------------------
  # ChromaDB Vector Store
  # ----------------------------------------------------------------------------
  - job_name: "univex-chromadb"
    static_configs:
      - targets: ["chromadb:8000"]
        labels:
          service: "chromadb"
          component: "vector-store"
    metrics_path: "/api/v1/metrics"
    scrape_interval: 60s

  # ----------------------------------------------------------------------------
  # VictoriaMetrics Self-Monitoring
  # ----------------------------------------------------------------------------
  - job_name: "victoriametrics"
    static_configs:
      - targets: ["victoriametrics:8428"]
        labels:
          service: "victoriametrics"
          component: "metrics-store"
    metrics_path: "/metrics"
    scrape_interval: 15s

  # ----------------------------------------------------------------------------
  # ClickHouse Analytics — clickhouse_exporter
  # ----------------------------------------------------------------------------
  - job_name: "univex-clickhouse"
    static_configs:
      - targets: ["clickhouse:9363"]
        labels:
          service: "clickhouse"
          component: "analytics"
    scrape_interval: 30s

  # ----------------------------------------------------------------------------
  # Grafana
  # ----------------------------------------------------------------------------
  - job_name: "univex-grafana"
    static_configs:
      - targets: ["grafana:3000"]
        labels:
          service: "grafana"
          component: "dashboards"
    metrics_path: "/metrics"
    scrape_interval: 60s

  # ----------------------------------------------------------------------------
  # Loki Log Aggregator
  # ----------------------------------------------------------------------------
  - job_name: "univex-loki"
    static_configs:
      - targets: ["loki:3100"]
        labels:
          service: "loki"
          component: "log-aggregation"
    metrics_path: "/metrics"
    scrape_interval: 30s

  # ----------------------------------------------------------------------------
  # Jaeger Tracing Backend
  # ----------------------------------------------------------------------------
  - job_name: "univex-jaeger"
    static_configs:
      - targets: ["jaeger:14269"]
        labels:
          service: "jaeger"
          component: "tracing"
    metrics_path: "/metrics"
    scrape_interval: 30s
