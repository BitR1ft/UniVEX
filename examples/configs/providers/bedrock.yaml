# AWS Bedrock LLM Provider Configuration
# Documentation: https://docs.aws.amazon.com/bedrock/
#
# Authentication options (choose one):
#   1. IAM role (recommended for EC2/ECS/Lambda — no keys needed)
#   2. Environment variables:
#        export AWS_ACCESS_KEY_ID=...
#        export AWS_SECRET_ACCESS_KEY=...
#        export AWS_REGION=us-east-1
#   3. AWS profile: export AWS_PROFILE=my-profile
#
provider: bedrock
name: bedrock
# base_url is not used for Bedrock (managed via boto3 / AWS region)
api_key: ""
default_model: anthropic.claude-3-5-sonnet-20241022-v2:0
available_models:
  # Anthropic Claude (requires Model Access in AWS Console)
  - anthropic.claude-3-5-sonnet-20241022-v2:0
  - anthropic.claude-3-5-haiku-20241022-v1:0
  - anthropic.claude-3-opus-20240229-v1:0
  - anthropic.claude-3-sonnet-20240229-v1:0
  - anthropic.claude-3-haiku-20240307-v1:0
  - anthropic.claude-v2:1
  # Amazon Titan (always available)
  - amazon.titan-text-premier-v1:0
  - amazon.titan-text-express-v1
  - amazon.titan-text-lite-v1
  # AI21 Jamba / Jurassic
  - ai21.jamba-1-5-large-v1:0
  - ai21.jamba-1-5-mini-v1:0
  - ai21.j2-ultra-v1
  - ai21.j2-mid-v1
  # Cohere Command
  - cohere.command-r-plus-v1:0
  - cohere.command-r-v1:0
  - cohere.command-text-v14
max_tokens: 4096
temperature: 0.7
timeout: 120
extra_params:
  # AWS region — can also be set via AWS_REGION env var
  region: us-east-1
